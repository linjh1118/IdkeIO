# site properties and page defaults
title: IDKE 实验室
subtitle: Northeastern University · 东北大学
description: 'IDKE 实验室聚焦大语言模型、知识图谱与自然语言处理，探索偏好对齐、智能体、多模态理解、知识图谱补全与推理。'
header: images/school.jpg
footer: images/school.jpg
proofer: false
future: true

# GitHub Pages 配置 - 如果部署为子路径，请设置 baseurl
baseurl: "/IdkeIO"  # 部署为 linjh1118.github.io/IdkeIO/ 时使用
# baseurl: ""       # 部署为主页或自定义域名时取消注释此行，注释掉上一行

url: "https://linjh1118.github.io"  # 你的 GitHub Pages 地址

# site social media and other links
links:
  github: linjh1118/IdkeIO

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post
  # Markdown files in /_cources
  - scope:
      type: "courses"
    values:
      layout: course

collections:
  # generate page for each member
  members:
    output: false
  # generate page for each post
  posts:
    output: true
  # generate page for each course
  courses:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff

  # Retain template examples in source, but do not publish them as IDKE content.
  - _posts
  - _courses
  - news
  - course
  - projects
  - 如何改成你自己的实验室主页.md
  - 快速部署指南.md
  - 更新日志.md
  - 部署教程.md
